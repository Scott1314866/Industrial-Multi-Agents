<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .label { font-size: 15px; font-weight: 600; fill: #111827; }
    .small { font-size: 12px; fill: #6b7280; }
    .lane { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .edge-label { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">注塑机控制系统 · A2A 多智能体架构</text>
  <text x="48" y="73" class="subtitle">主控统一识别意图；产品检索既支持客户直查，也作为产品经理 Agent 的下游能力</text>

  <rect x="32" y="102" width="1536" height="570" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="48" y="120" width="394" height="532" rx="12" fill="#eff6ff" fill-opacity="0.65" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="66" y="145" class="lane" fill="#2563eb">访问与编排层</text>
  <rect x="462" y="120" width="1086" height="302" rx="12" fill="#f0fdf4" fill-opacity="0.55" stroke="#bbf7d0" stroke-dasharray="7,5"/>
  <text x="480" y="145" class="lane" fill="#15803d">知识问答层</text>
  <rect x="462" y="442" width="1086" height="210" rx="12" fill="#fff7ed" fill-opacity="0.62" stroke="#fed7aa" stroke-dasharray="7,5"/>
  <text x="480" y="467" class="lane" fill="#c2410c">产品咨询与报价层</text>

  <!-- Agent and process flows -->
  <path d="M 178 369 H 252" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 420 320 C 470 320, 470 207, 520 207" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 420 369 H 520" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 420 418 C 455 418, 470 526, 512 526" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 420 394 C 448 394, 445 608, 485 608 H 990 V 582" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="624" y="592" width="148" height="26" rx="5" fill="#f8fafc" opacity="0.97"/>
  <text x="698" y="610" text-anchor="middle" class="edge-label" fill="#2563eb">直接检索产品信息</text>

  <path d="M 670 207 H 710 V 250 H 746" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 670 369 C 706 369, 710 287, 746 287" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 660 526 H 758" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 918 526 H 990" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 1150 526 H 1218" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 1362 526 H 1410" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- RAG data flows -->
  <path d="M 916 270 C 950 270, 956 188, 990 188" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 916 270 H 990" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 916 270 C 950 270, 956 352, 990 352" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 1210 298 V 458 H 1070 V 490" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="1218" y="365" width="126" height="26" rx="5" fill="#f8fafc" opacity="0.97"/>
  <text x="1281" y="383" text-anchor="middle" class="edge-label" fill="#059669">产品参数与价格</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="68" y="330" width="110" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="123" cy="352" r="9" fill="#dbeafe" stroke="#2563eb"/>
    <path d="M 108 378 Q 108 362 123 362 Q 138 362 138 378" fill="#dbeafe" stroke="#2563eb"/>
    <text x="123" y="397" text-anchor="middle" class="label">客户问题</text>
  </g>

  <!-- Orchestrator -->
  <g filter="url(#shadow)">
    <rect x="252" y="295" width="168" height="148" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
    <rect x="258" y="301" width="156" height="136" rx="10" fill="none" stroke="#60a5fa" stroke-width="1"/>
    <circle cx="336" cy="329" r="16" fill="#2563eb"/>
    <path d="M 328 329 L 334 335 L 345 322" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="336" y="363" text-anchor="middle" class="label">主控 Agent</text>
    <text x="336" y="387" text-anchor="middle" class="small">意图识别与路由</text>
    <text x="336" y="410" text-anchor="middle" class="small">A2A Server Network</text>
  </g>

  <!-- Knowledge agents -->
  <g>
    <rect x="520" y="174" width="150" height="66" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
    <text x="595" y="202" text-anchor="middle" class="label">诊断助手</text>
    <text x="595" y="222" text-anchor="middle" class="small">维修诊断与排障</text>

    <rect x="520" y="336" width="150" height="66" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
    <text x="595" y="364" text-anchor="middle" class="label">操作助手</text>
    <text x="595" y="384" text-anchor="middle" class="small">说明书操作指导</text>

    <rect x="746" y="235" width="170" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="831" y="266" text-anchor="middle" class="label">三层 RAG</text>
    <text x="831" y="287" text-anchor="middle" class="small">召回 · 重排 · 生成</text>
  </g>

  <!-- Data stores -->
  <g>
    <ellipse cx="1055" cy="164" rx="65" ry="15" fill="#fee2e2" stroke="#dc382d" stroke-width="1.5"/>
    <rect x="990" y="164" width="130" height="48" fill="#fee2e2"/>
    <line x1="990" y1="164" x2="990" y2="212" stroke="#dc382d" stroke-width="1.5"/>
    <line x1="1120" y1="164" x2="1120" y2="212" stroke="#dc382d" stroke-width="1.5"/>
    <ellipse cx="1055" cy="212" rx="65" ry="15" fill="#fecaca" stroke="#dc382d" stroke-width="1.5"/>
    <text x="1055" y="188" text-anchor="middle" class="label">Redis</text>
    <text x="1055" y="205" text-anchor="middle" class="small">缓存 / 会话</text>

    <ellipse cx="1120" cy="246" rx="130" ry="16" fill="#dbeafe" stroke="#4479a1" stroke-width="1.5"/>
    <rect x="990" y="246" width="260" height="52" fill="#dbeafe"/>
    <line x1="990" y1="246" x2="990" y2="298" stroke="#4479a1" stroke-width="1.5"/>
    <line x1="1250" y1="246" x2="1250" y2="298" stroke="#4479a1" stroke-width="1.5"/>
    <ellipse cx="1120" cy="298" rx="130" ry="16" fill="#bfdbfe" stroke="#4479a1" stroke-width="1.5"/>
    <text x="1120" y="271" text-anchor="middle" class="label">MySQL</text>
    <text x="1120" y="291" text-anchor="middle" class="small">文档信息 / 产品参数 / 价格</text>

    <ellipse cx="1055" cy="328" rx="65" ry="15" fill="#e0f2fe" stroke="#00a1ea" stroke-width="1.5"/>
    <rect x="990" y="328" width="130" height="48" fill="#e0f2fe"/>
    <line x1="990" y1="328" x2="990" y2="376" stroke="#00a1ea" stroke-width="1.5"/>
    <line x1="1120" y1="328" x2="1120" y2="376" stroke="#00a1ea" stroke-width="1.5"/>
    <ellipse cx="1055" cy="376" rx="65" ry="15" fill="#bae6fd" stroke="#00a1ea" stroke-width="1.5"/>
    <text x="1055" y="352" text-anchor="middle" class="label">Milvus</text>
    <text x="1055" y="369" text-anchor="middle" class="small">向量检索</text>
  </g>

  <!-- Product path -->
  <g>
    <rect x="512" y="490" width="148" height="72" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.6"/>
    <text x="586" y="521" text-anchor="middle" class="label">产品经理 Agent</text>
    <text x="586" y="543" text-anchor="middle" class="small">选型与方案编排</text>

    <rect x="758" y="490" width="160" height="72" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.6"/>
    <text x="838" y="521" text-anchor="middle" class="label">需求分析 Agent</text>
    <text x="838" y="543" text-anchor="middle" class="small">提取规模与配置需求</text>

    <rect x="990" y="490" width="160" height="92" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.3"/>
    <rect x="996" y="496" width="148" height="80" rx="9" fill="none" stroke="#fb923c" stroke-width="0.9"/>
    <text x="1070" y="525" text-anchor="middle" class="label">产品检索 Agent</text>
    <text x="1070" y="548" text-anchor="middle" class="small">型号 · 参数 · 基础价格</text>
    <text x="1070" y="567" text-anchor="middle" class="small">可被主控或产品经理调用</text>

    <rect x="1218" y="493" width="144" height="66" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.6"/>
    <text x="1290" y="521" text-anchor="middle" class="label">确定性报价工具</text>
    <text x="1290" y="542" text-anchor="middle" class="small">规模与配置计价</text>

    <rect x="1410" y="493" width="118" height="66" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
    <text x="1469" y="519" text-anchor="middle" class="label">人工兜底</text>
    <text x="1469" y="541" text-anchor="middle" class="small">返回售后电话</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1190,690)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="44" y="12" class="small">Agent 调用</text>
    <line x1="140" y1="8" x2="174" y2="8" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="184" y="12" class="small">数据检索</text>
    <line x1="272" y1="8" x2="306" y2="8" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="316" y="12" class="small">人工兜底</text>
  </g>
</svg>
