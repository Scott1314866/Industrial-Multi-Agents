  <text x="42" y="70" class="subtitle">A2A 负责 Agent 间协作与任务路由；MCP/工具层负责 RAG、数据库检索和确定性报价</text>

  <!-- Network boundary -->
  <rect x="32" y="92" width="1736" height="930" rx="18" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="54" y="119" class="lane" fill="#2563eb">A2A SERVER NETWORK</text>

  <!-- Agent lanes -->
