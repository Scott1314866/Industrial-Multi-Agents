  <path d="M 900 318 V 342 H 225 V 405" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 900 318 V 342 H 585 V 405" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 900 318 V 405" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 900 318 V 342 H 1305 V 405" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M 1055 268 H 1619 V 405" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

