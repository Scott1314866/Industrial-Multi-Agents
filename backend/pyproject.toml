[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "industrial-injection-agents"
version = "0.1.0"
description = "Enterprise LangGraph platform for injection-molding intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "langgraph==1.0.9",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-redis>=0.5.1,<0.6",
  "langchain-openai>=1.0,<2",
  "python-a2a==0.5.4",
  "sqlalchemy[asyncio]==2.0.42",
  "asyncmy>=0.2.10,<0.3",
  "aiosqlite>=0.21,<0.22",
  "alembic>=1.16,<2",
  "redis[hiredis]>=6.2,<7",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<0.3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<0.29",
  "orjson>=3.11,<4",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "asgi-lifespan>=2.1,<3",
  "mypy>=1.17,<2",
  "ruff>=0.12,<0.13",
]

[project.scripts]
ima-api = "industrial_agents.api:run"
ima-worker = "industrial_agents.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
